name: Deploy to AWS ECR

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Fazer login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Instalar JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permissão de execução ao Gradle
        run: chmod +x gradlew

      - name: Criar build do projeto (Gerar JAR)
        run: ./gradlew build --no-daemon

      - name: Verificar se o JAR foi gerado corretamente
        run: ls -lah build/libs/

      - name: Construir e enviar a imagem para o ECR
        env:
          ECR_REGISTRY: 730335530459.dkr.ecr.us-east-1.amazonaws.com
          ECR_REPOSITORY: kotlindeployecr
          IMAGE_TAG: latest
        run: |
          docker build -t kotlindeployecr:latest .
          docker tag kotlindeployecr:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
